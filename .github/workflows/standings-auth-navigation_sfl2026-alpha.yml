# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - sfl2026-alpha

on:
  push:
    branches:
      - alpha
      - "standings-auth-navigation"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Copy static assets
        run: |
          cp -r ./.next/static ./.next/standalone/.next ## this probably belongs on a CDN
          cp -r ./public ./.next/standalone ## this probably belongs on a CDN
          # find ./.next/standalone -type f -name "*.js" | xargs sed -i 's/node:inspector/node--inspector/g'
          # find ./.next/standalone -type f -name "*node:inspector*" -exec bash -c 'mv "$0" "${0//:/--}"' {} \;

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: next-app
          path: ./.next/standalone

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: next-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_889FE54CAFE548C1A1965A064A3B7B12 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2552FC9BBEAA461FB4428E18A3A6808E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_025F70715E194E8BAB050B113CE33AC5 }}

      - name: "Deploy to Azure Web App"
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "sfl2026-alpha"
          slot-name: "Production"
          package: .
